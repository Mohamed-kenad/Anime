name: Deploy API (Vercel)

on:
  push:
    branches: [main]
    paths:
      - 'server.js'
      - 'lib/**'
      - 'api/**'
      - 'vercel.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  VERCEL_PROJECT: anime-wit10-up-pro
  VERCEL_PROJECT_ID: prj_WaUEtozFIoXZ1G3RTytRvpVyJKf2
  VERCEL_ORG_ID: team_MG9smmWr6FuurMNLe5tNcYNY

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Repository secret VERCEL_TOKEN is missing. Create a token at https://vercel.com/account/tokens (Scope: Full Account) and add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      # The CLI's team/user lookup fails for this token ("User not found"), so
      # link the project by writing the known IDs instead of running `vercel link`.
      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json
          cat .vercel/project.json

      # Best-effort: new env vars only take effect on the deployment below, so
      # run this before the deploy. Never fails the job — skip when the secret
      # is unset, warn on API errors.
      - name: Sync environment variables
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          UPSTREAM_RELAY: ${{ secrets.UPSTREAM_RELAY }}
          UPSTREAM_RELAY_TOKEN: ${{ secrets.UPSTREAM_RELAY_TOKEN }}
          UPSTREAM_JINA_KEY: ${{ secrets.UPSTREAM_JINA_KEY }}
        run: |
          node <<'NODE'
          const names = ['UPSTREAM_RELAY', 'UPSTREAM_RELAY_TOKEN', 'UPSTREAM_JINA_KEY'];
          (async () => {
            for (const name of names) {
              const value = process.env[name];
              if (!value) { console.log(`${name} not set - skipping.`); continue; }
              try {
                const res = await fetch(`https://api.vercel.com/v10/projects/${process.env.VERCEL_PROJECT_ID}/env`, {
                  method: 'POST',
                  headers: { authorization: `Bearer ${process.env.VERCEL_TOKEN}`, 'content-type': 'application/json' },
                  body: JSON.stringify({ key: name, value, target: ['production'], type: 'encrypted' })
                });
                if (res.ok || res.status === 409) console.log(`${name} synced (HTTP ${res.status}).`);
                else console.log(`::warning::${name}: HTTP ${res.status} ${await res.text()}`);
              } catch (e) {
                console.log(`::warning::${name}: ${e.message}`);
              }
            }
          })();
          NODE

      - name: Deploy to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"

      - name: Verify deployment health
        run: |
          url="https://$VERCEL_PROJECT.vercel.app/api/health"
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$url" | grep -q '"ok":true'; then
              echo "Healthy: $url"
              exit 0
            fi
            echo "Waiting for $url ($i/30)..."
            sleep 5
          done
          echo "::error::$url never became healthy. Check the deployment at https://vercel.com."
          exit 1
